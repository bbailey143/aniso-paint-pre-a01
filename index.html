<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>aniso-paint</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/window-manager.css" />
    <link rel="stylesheet" href="/src/ui/command-palette.css" />
  </head>
  <body>
    <canvas id="stage" touch-action="none"></canvas>
    <div id="hud" class="panel">
      <span class="hud-title">aniso-paint</span>
      <span id="hud-gpu" class="hud-line">webgpu: …</span>
      <span id="hud-zoom" class="hud-line" title="Wheel to zoom · middle-drag or space-drag to pan · Ctrl+0 to fit">100%</span>
    </div>
    <div id="stylus" class="panel">
      <div class="stylus-row"><span>type</span><b id="s-type">—</b></div>
      <div class="stylus-row"><span>pressure</span><b id="s-pressure">—</b></div>
      <div class="stylus-row"><span>tilt</span><b id="s-tilt">—</b></div>
      <div class="stylus-row"><span>velocity</span><b id="s-velocity">—</b></div>
      <div class="stylus-row"><span>twist</span><b id="s-twist">—</b></div>
    </div>
    <div id="gauges" class="panel">
      <span class="hud-title">conservation</span>
      <div class="stylus-row"><span>water</span><b id="g-water">—</b></div>
      <div class="stylus-row"><span>pigment</span><b id="g-pigment">—</b></div>
      <div class="stylus-row"><span>ink/graphite</span><b id="g-ink">—</b></div>
      <div class="stylus-row"><span>wet cells</span><b id="g-wet">—</b></div>
      <div class="stylus-row"><span>mean |div|</span><b id="g-div">—</b></div>
      <div class="stylus-row"><span>relax</span><b id="g-relax">—</b></div>
    </div>
    <aside id="conte-viewer" class="panel" aria-hidden="true">
      <div class="conte-head"><span class="hud-title">Conte contact</span><span id="conte-contact" class="conte-contact">square end</span></div>
      <div class="conte-scene" aria-hidden="true"><div class="conte-paper"></div><div id="conte-shadow" class="conte-shadow"></div><div id="conte-stick" class="conte-stick"><i class="conte-face conte-front"></i><i class="conte-face conte-back"></i><i class="conte-face conte-left"></i><i class="conte-face conte-right"></i><i class="conte-face conte-top"></i><i class="conte-face conte-bottom"></i></div></div>
      <div class="conte-readout"><span>tilt <b id="conte-tilt">0 deg</b></span><span>azimuth <b id="conte-azimuth">0 deg</b></span><span>twist <b id="conte-twist">0 deg</b></span></div>
      <label class="conte-flat" title="Lay Flat"><input id="conte-lay-flat" type="checkbox" /><span>Lay Flat</span></label>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
