<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>aniso-paint</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The paint surface. Full-bleed; everything else floats over it. -->
    <canvas id="stage" touch-action="none"></canvas>

    <!-- Debug chrome. Not a panel any more: main.ts hands this whole block to
         the left rail, which keeps it folded away until the Debug tab is
         pressed. Instrument readings should be available, not resident. -->
    <div id="debug-panel" hidden>
      <div class="debug-body">
        <section id="hud" class="debug-card">
          <h3 class="debug-subtitle"><span>App</span></h3>
          <span class="hud-title">aniso-paint</span>
          <span id="hud-gpu" class="hud-line">webgpu: ...</span>
          <!-- Wheel zooms about the cursor, middle-drag or space-drag pans,
               Ctrl/Cmd+0 fits the sheet again. -->
          <span id="hud-zoom" class="hud-line"
                title="Wheel to zoom - middle-drag or space-drag to pan - Ctrl+0 to fit">100%</span>
        </section>

        <!-- Frame cost, and the two switches that tell you where it went.
             Real GPU timings need timestamp queries, which are not WebGPU core
             and so are bench-only under D12 — these are CPU-side numbers. They
             still separate the cases: if `frame` is long while `cpu` is short,
             the time is going to the GPU or the compositor, not to JavaScript. -->
        <section id="perf" class="debug-card">
          <h3 class="debug-subtitle"><span>Performance</span></h3>
          <div class="stylus-row"><span>frame</span><b id="p-frame">-</b></div>
          <div class="stylus-row"><span>fps</span><b id="p-fps">-</b></div>
          <!-- The mean hides hitching: 60 fps average with an occasional 40 ms
               frame feels worse than a steady 55 and reads better. This is the
               worst frame of the last run, and the count of frames that missed
               a 60 Hz budget. -->
          <div class="stylus-row"><span>worst</span><b id="p-worst">-</b></div>
          <div class="stylus-row"><span>missed</span><b id="p-missed">-</b></div>
          <div class="stylus-row"><span>cpu</span><b id="p-cpu">-</b></div>
          <div class="stylus-row"><span>buffer</span><b id="p-buffer">-</b></div>
          <label class="perf-row" title="Draw the sheet at a fraction of the display's pixels. The simulation grid never changes — only how many pixels the result is shown at. If the lag clears at 50%, the frame is fill-rate bound.">
            <span>render scale</span>
            <select id="p-scale">
              <option value="1">100%</option>
              <option value="0.75">75%</option>
              <option value="0.5">50%</option>
            </select>
          </label>
          <label class="perf-row" title="The frosted-glass effect behind every panel and rail. Safari re-blurs what is behind them, and the thing behind them is a canvas that changes every frame.">
            <span>panel blur</span>
            <input id="p-blur" type="checkbox" checked />
          </label>
          <label class="perf-row" title="How much of the window the COLOUR is worked out at. The paper grain stays full resolution either way, so this stays much sharper than render scale does. Sharp is the original behaviour. Look at soft edges and at bleeds where two colours meet — that is where a difference would show.">
            <span>colour detail</span>
            <select id="p-colour">
              <option value="1">sharp</option>
              <option value="0.5">fast (half)</option>
              <option value="0.35">faster (third)</option>
            </select>
          </label>
          <label class="perf-row" title="The paper's tooth lighting. It is evaluated procedurally at screen resolution — four noise samples per pixel, on every pixel of the sheet whether paint is there or not. Off means flat paper: the sheet loses its grain, so this is a measurement, not a way to work.">
            <span>paper relief</span>
            <input id="p-relief" type="checkbox" checked />
          </label>
          <button id="p-reset" class="pal-btn" type="button" title="Clear the worst-frame and missed-frame counters before a fresh measurement">reset counters</button>
        </section>

        <section id="stylus" class="debug-card">
          <h3 class="debug-subtitle"><span>Stylus</span></h3>
          <div class="stylus-row"><span>type</span><b id="s-type">-</b></div>
          <div class="stylus-row"><span>pressure</span><b id="s-pressure">-</b></div>
          <div class="stylus-row"><span>tilt</span><b id="s-tilt">-</b></div>
          <div class="stylus-row"><span>velocity</span><b id="s-velocity">-</b></div>
          <div class="stylus-row"><span>twist</span><b id="s-twist">-</b></div>
        </section>

        <section id="gauges" class="debug-card">
          <h3 class="debug-subtitle"><span>Conservation</span></h3>
          <div class="stylus-row"><span>water</span><b id="g-water">-</b></div>
          <div class="stylus-row"><span>pigment</span><b id="g-pigment">-</b></div>
          <!-- Dry media keep their own line. They live on a finer grid in different
               units, so adding them to `pigment` would bury a wet-band leak. -->
          <div class="stylus-row"><span>ink/graphite</span><b id="g-ink">-</b></div>
          <div class="stylus-row"><span>wet cells</span><b id="g-wet">-</b></div>
          <div class="stylus-row"><span>mean |div|</span><b id="g-div">-</b></div>
          <div class="stylus-row"><span>relax</span><b id="g-relax">-</b></div>
        </section>
      </div>
    </div>

    <!-- Conte contact instrument. It is shown only while that rectangular stick
         is in hand; its pose comes from the same stylus sample as the mark. -->
    <aside id="conte-viewer" class="panel" aria-hidden="true">
      <div class="conte-head">
        <span class="hud-title">Conte contact</span>
        <span id="conte-contact" class="conte-contact">square end</span>
      </div>
      <div class="conte-scene" aria-hidden="true">
        <div class="conte-paper"></div>
        <div id="conte-shadow" class="conte-shadow"></div>
        <div id="conte-stick" class="conte-stick">
          <i class="conte-face conte-front"></i>
          <i class="conte-face conte-back"></i>
          <i class="conte-face conte-left"></i>
          <i class="conte-face conte-right"></i>
          <i class="conte-face conte-top"></i>
          <i class="conte-face conte-bottom"></i>
        </div>
      </div>
      <div class="conte-readout">
        <span>tilt <b id="conte-tilt">0 deg</b></span>
        <span>azimuth <b id="conte-azimuth">0 deg</b></span>
        <span>twist <b id="conte-twist">0 deg</b></span>
      </div>
      <label class="conte-flat" title="Lay Flat - use the crayon's full rectangular side for broad fields and rubbing">
        <input id="conte-lay-flat" type="checkbox" />
        <span>Lay Flat</span>
      </label>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
